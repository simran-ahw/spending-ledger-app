name: Deploy database and server functions to Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing secret:SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing secret:SUPABASE_DB_PASSWORD"
          [ -z "$PROJECT_REF" ] && missing="$missing variable:SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi

      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database changes
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD"

      - name: Set function secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPID_CONTACT: ${{ vars.VAPID_CONTACT }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: |
          : > .secrets.env
          for v in ANTHROPIC_API_KEY VAPID_PRIVATE_KEY CRON_SECRET VAPID_CONTACT APP_ORIGIN; do
            if [ -n "${!v}" ]; then printf "%s='%s'\n" "$v" "$(printf '%s' "${!v}" | tr -d '\n')" >> .secrets.env; fi
          done
          if [ -s .secrets.env ]; then supabase secrets set --env-file .secrets.env; fi
          rm -f .secrets.env

      - name: Deploy functions
        run: supabase functions deploy --use-api
